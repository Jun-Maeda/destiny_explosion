<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript × Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Python計算機</h5>
                    </div>
                    <div class="card-body">
                        <p class="card-text">Pythonで生成されたデータ：</p>
                        <div id="output" class="alert alert-info py-2">
                            読み込み中...
                        </div>
                        <button id="my-btn" class="btn btn-success w-100">再挑戦する</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="py">
        from pyscript import document
        import random

        def calculate_random(event=None):
            # ランダムな数値を計算
            num = random.randint(1, 100)
            # Bootstrapを適用したHTMLを流し込む
            output_div = document.querySelector("#output")
            output_div.innerHTML = f"ラッキーナンバー: <strong>{num}</strong>"

        # 初回実行
        calculate_random()

        # ボタンにイベントを登録
        btn = document.querySelector("#my-btn")
        btn.onclick = calculate_random
    </script>
</body>
</html>
